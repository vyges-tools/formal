[package]
name = "vyges-formal"
version = "0.1.56"
edition = "2021"
description = "Formal property campaigns on RTL: monitors bound into the design, every property proved or refuted, counterexamples replayed in simulation, mutants to measure the property set, one report."
license = "Apache-2.0"
authors = ["Vyges <https://vyges.com/contact>"]
homepage = "https://vyges.com"
repository = "https://github.com/vyges-tools/formal"

# The campaign drives three programs and reads what they write: yosys (elaborate, bind, synthesize),
# vyges-lec (prove each property), Verilator (replay each counterexample). The manifest is TOML; lec,
# yosys and the report speak JSON.
[dependencies]
serde_json = { version = "1", features = ["preserve_order"] }
toml = { version = "0.8", features = ["preserve_order"] }
regex = "1"
sha2 = "0.10"
# Structured events (vyges-events/1.0) for the MCP causal trail. Core-only.
vyges-events = { git = "https://github.com/vyges-tools/events", branch = "main", default-features = false }

# The binary's global allocator. The reference build links tcmalloc for all of its code
# (BUILD.bazel `malloc = @tcmalloc`), not the system allocator; mimalloc measured fastest and
# smallest of tcmalloc / jemalloc / mimalloc on a like-for-like trial. Pinned exactly:
# libmimalloc-sys 0.1.44 bundles mimalloc v2 by default (0.1.45 on default to v3).
mimalloc = { version = "=0.1.48", default-features = false, optional = true }
libmimalloc-sys = { version = "=0.1.44", default-features = false, optional = true }

# On Linux the allocator also REPLACES malloc/free process-wide (`override`), so C++ code linked
# into the binary allocates through it too, as the reference's statically linked tcmalloc does for
# all of its code. Not on macOS, where the system zone allocator is left alone.
[target.'cfg(target_os = "linux")'.dependencies]
libmimalloc-sys = { version = "=0.1.44", default-features = false, features = ["override"], optional = true }

[features]
# The command-line entry built into the library too (`cli_main`), for the suite binaries
# that link every engine and run the one they are invoked as.
suite = []
default = ["mimalloc"]

# The binary's allocator (see [dependencies]). On by default for the binary; the suite, the only
# library consumer, links it too.
mimalloc = ["dep:mimalloc", "dep:libmimalloc-sys"]

[[bin]]
name = "vyges-formal"
path = "src/main.rs"

[lib]
name = "vyges_formal"
path = "src/lib.rs"

# The reference is built -O3 with link-time optimisation (Bazel --config=release). LTO and one
# codegen unit let calls inline across crates; by language rule neither changes a result.
[profile.release]
lto = "fat"
codegen-units = 1
